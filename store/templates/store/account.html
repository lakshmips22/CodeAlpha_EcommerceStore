<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your account | ShopSphere</title>
    <link rel="stylesheet" href="{% static 'store/css/auth.css' %}">
</head>
<body class="auth-page">
    <header class="auth-header">
        <a class="logo" href="{% url 'home' %}">ShopSphere.</a>
        <nav aria-label="Main navigation">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'home' %}#cart">Cart ({{ cart_count }})</a>
            {% include "store/partials/account_nav.html" %}
        </nav>
    </header>
    <main class="auth-card account-card">
        <h1>Your account</h1>
        <p>You are signed in as <strong>{{ user.get_username }}</strong>.</p>
        {% if user.email %}<p>Email: {{ user.email }}</p>{% endif %}
        <p class="auth-switch"><a href="{% url 'order_history' %}">My Orders</a></p>
        <p class="auth-switch"><a href="{% url 'home' %}#products">Continue shopping</a></p>
    </main>
</body>
</html>
