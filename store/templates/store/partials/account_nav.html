{% if user.is_authenticated %}
    <a href="{% url 'order_history' %}">My Orders</a>
    <a href="{% url 'account' %}">{{ user.get_username }}</a>
    <form class="auth-nav-form" action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button class="auth-nav-button" type="submit">Logout</button>
    </form>
{% else %}
    <a href="{% url 'login' %}">Login</a>
    <a href="{% url 'register' %}">Register</a>
{% endif %}
